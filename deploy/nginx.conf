# nginx для GRAFF: TLS, статика приложения и прокси API.
#
# Файл монтируется как /etc/nginx/conf.d/default.conf, то есть подключается внутрь
# блока http{} штатной конфигурации nginx. Поэтому здесь только upstream и server-блоки.
#
# ПЕРЕД ЗАПУСКОМ замените graff.example.ru на настоящий домен (три места ниже)
# и убедитесь, что сертификат уже выпущен, иначе nginx не стартует:
#   grep -rn graff.example.ru deploy/nginx.conf

upstream graff_app {
    # app — имя сервиса из docker-compose.yml, DNS внутри сети Docker.
    server app:3000;
    keepalive 16;
}

# ---------- 80: проверка домена и переезд на HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name graff.example.ru;

    # Проверка владения доменом при выпуске и продлении сертификата (certbot --webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 443: приложение и API ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Директива http2 отдельной строкой — так это делается в nginx 1.25 и новее
    # (в образе nginx:alpine версия свежее). На старом nginx пишут «listen 443 ssl http2;».
    http2 on;
    server_name graff.example.ru;

    # Сертификаты Let's Encrypt: каталог /etc/letsencrypt смонтирован с хоста только для чтения.
    ssl_certificate     /etc/letsencrypt/live/graff.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/graff.example.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Сжатие: JSON и JS-бандл ужимаются в разы, картинки и шрифты не трогаем.
    # Директивы стоят в server-блоке, чтобы не спорить с настройками из основного nginx.conf.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/manifest+json image/svg+xml;

    # Тело запроса ограничено и на сервере (256 КБ), здесь запас на случай длинного заказа.
    client_max_body_size 1m;

    # Заголовки безопасности. Внимание: add_header внутри location отменяет унаследованные,
    # поэтому в блоках ниже, где есть свой add_header, важные заголовки повторены.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ---------- живые статусы заказа (SSE) ----------
    # Поток держится открытым часами: буферизацию и таймаут чтения настраиваем отдельно,
    # иначе события доходят пачками или соединение рвётся через минуту.
    # Точное совпадение (=) важно: этот блок должен выигрывать у общего /api/.
    location = /api/stream {
        # Слэш в конце адреса срезает префикс: /api/stream → /stream на сервере.
        proxy_pass http://graff_app/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding off;

        # Подсказка прокси не копить ответ (её же ставит сервер в заголовке ответа).
        add_header X-Accel-Buffering no;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-store";

        # EventSource не умеет заголовки, поэтому токен приходит параметром адреса.
        # В журнал доступа такой адрес писать нельзя — это фактически пароль.
        access_log off;
    }

    # ---------- остальное API ----------
    # Сервер отдаёт маршруты в корне (/auth/verify, /orders, /tables, /staff/...),
    # а приложение собрано с VITE_API_URL=/api. Слэш в конце proxy_pass срезает
    # префикс: /api/orders → /orders. Если сервер когда-нибудь начнёт сам обслуживать
    # префикс /api, уберите слэш: proxy_pass http://graff_app;
    location /api/ {
        proxy_pass http://graff_app/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        # Ответы API содержат данные заказов — кэшировать их нельзя.
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Проверка живости сервера (мониторинг, healthcheck снаружи).
    location = /health {
        proxy_pass http://graff_app;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---------- статика ----------
    # Файлы с хэшем в имени не меняются никогда — кэшируем надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
        try_files $uri =404;
    }

    # Служебный поток обновления приложения: если его закэшировать,
    # телефон останется на старой версии до очистки данных браузера.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Одностраничное приложение: любой адрес (/menu, /orders, /staff) отдаёт index.html,
    # маршрутизацию дальше делает React.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
