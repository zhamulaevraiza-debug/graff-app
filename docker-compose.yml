# Боевой запуск GRAFF на одной виртуальной машине (Yandex Cloud, VK Cloud, Selectel, Timeweb).
#
# Два контейнера:
#   app   — сервер API на Node 22, база SQLite в томе graff-data;
#   nginx — TLS, статика приложения и прокси /api на app.
#
# Схема раздачи статики: собранное приложение лежит внутри образа nginx (стадия web
# в Dockerfile). Общий том не нужен, а `docker compose build` всегда обновляет
# и клиент, и сервер из одного исходного дерева. Конфигурация nginx и сертификаты
# монтируются с диска — их можно править без пересборки.
#
# Первый запуск:
#   cp server/.env.example server/.env   # и заполнить JWT_SECRET, SMS_*, STAFF_*, VAPID_*
#   docker compose build
#   docker compose up -d
# Сертификат должен быть выпущен ДО первого старта nginx (см. server/README.md).
# SMS_PROVIDER обязателен: с пустым значением (равно «log») сервер в режиме production
# не стартует, healthcheck не проходит — и nginx из-за depends_on тоже не поднимется.
#
# Обновление:
#   docker compose build && docker compose up -d && docker compose restart nginx
# Последний шаг обязателен: nginx кэширует IP контейнера app с момента своего старта.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        # Значение попадает в копию статики внутри образа app, а её никто не раздаёт
        # (см. комментарий в Dockerfile). Адрес API для браузера задаётся у сервиса nginx —
        # менять нужно именно там. Здесь аргумент оставлен, чтобы обе стадии собирались
        # с одним значением и статика в двух образах не расходилась.
        VITE_API_URL: ${VITE_API_URL:-/api}
    # Все настройки — в server/.env (пример со всеми переменными: server/.env.example).
    env_file:
      - ./server/.env
    environment:
      # Задано жёстко и намеренно перекрывает значение из server/.env: боевой контейнер
      # всегда должен работать в режиме production. В нём сервер требует JWT_SECRET,
      # не пишет тела запросов в журнал и не отдаёт код входа в ответе.
      # Опечатка в .env (NODE_ENV=prodction) здесь ни на что не влияет — и это хорошо.
      NODE_ENV: production
      # DB_FILE тут не задаём: путь берётся из server/.env, значение по умолчанию —
      # data/graff.db относительно /app/server, то есть внутри тома graff-data.
      # Менять его можно, но только на путь внутри /app/server/data: остальное не в томе.
    volumes:
      # База с персональными данными. Том живёт на диске виртуальной машины в России.
      - graff-data:/app/server/data
    # Порт наружу не публикуем: к серверу ходит только nginx по внутренней сети Docker.
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      # /health отвечает без обращения к базе и без персональных данных.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      # Журналы не должны съесть диск: телефоны в них не пишутся, но объём растёт.
      # 10 файлов по 10 МБ = 100 МБ на сервис. При инциденте основное доказательство —
      # таблица audit в базе, журнал контейнера к ней вспомогательный (см. server/README.md).
      driver: json-file
      options:
        max-size: "10m"
        max-file: "10"

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        # Именно этот образ раздаёт браузеру собранное приложение, поэтому адрес API
        # для клиента задаётся ЗДЕСЬ. По умолчанию относительный /api: приложение и API
        # на одном домене, префикс срезает nginx. Если API выносится на отдельный домен,
        # задайте переменную окружения перед сборкой, например:
        #   VITE_API_URL=https://api.graff.example.ru docker compose build
        # и не забудьте про CORS_ORIGINS в server/.env.
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Конфигурация подключается как conf.d/default.conf: внутри только upstream и server-блоки.
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Сертификаты Let's Encrypt с хоста (их выпускает certbot, установленный на машине).
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Каталог для проверки домена по HTTP (certbot --webroot) при продлении.
      - ./deploy/certbot-www:/var/www/certbot
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    logging:
      # nginx пишет строку на каждый запрос HTML и API (статика, поток событий и /health
      # исключены в deploy/nginx.conf), поэтому предел выше, чем у сервера:
      # 20 файлов по 20 МБ = 400 МБ. Вместе с журналом app это около полугигабайта
      # при рекомендованном диске в 20 ГБ. Нужен более долгий срок хранения —
      # выгружайте журналы отдельно: docker compose logs --since 720h nginx > nginx.log
      driver: json-file
      options:
        max-size: "20m"
        max-file: "20"

volumes:
  # Именованный том с базой. Резервная копия делается из него, см. server/README.md.
  graff-data:
